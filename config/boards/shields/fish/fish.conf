# キーボードの設定をカスタマイズする
# 項目は https://zmk.dev/docs/config/... を参照

# スリープモードを使う
CONFIG_ZMK_SLEEP=y
# 15分放置でスリープ
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Bluetooth接続を安定化
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# マウスポインターキーを使う
# CONFIG_ZMK_POINTING=y
# なかぼね配列：同時押しの重なり時間による分割をしない（0=無効）
CONFIG_NAGINATA_MIN_OVERLAP_MS=0
